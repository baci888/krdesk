# Shell (customer) build for Windows x64.
#
# Server settings are compiled into the app from repository secrets, so they
# are not stored in the source (see builtin_client_config in src/shell_policy.rs).
# They can be extracted from the executable. They are not an account, device,
# or lease check. When SHELL_ID_SERVER is set, custom.txt and an executable-name
# license cannot replace them.
#   secrets.SHELL_ID_SERVER     required, e.g. 1.2.3.4 or id.example.com
#   secrets.SHELL_RELAY_SERVER  optional, defaults to the ID server host
#   secrets.SHELL_API_SERVER    optional, defaults to http://<ID server>:21114
#   secrets.SHELL_KEY           public key of the ID server (id_ed25519.pub)
#   vars.SHELL_APP_NAME         optional app name, defaults to KRDesk
#
# Steps are taken from the build-for-windows-flutter job in flutter-build.yml,
# without the parts only the controlled side needs (virtual display, printer
# driver, privacy-mode window) and without signing or release publishing.
name: Shell Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - shell

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  SHELL_APP_NAME: "${{ vars.SHELL_APP_NAME }}"
  SHELL_ID_SERVER: "${{ secrets.SHELL_ID_SERVER }}"
  SHELL_RELAY_SERVER: "${{ secrets.SHELL_RELAY_SERVER }}"
  SHELL_API_SERVER: "${{ secrets.SHELL_API_SERVER }}"
  SHELL_KEY: "${{ secrets.SHELL_KEY }}"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows-x64:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Check shell settings
        shell: bash
        run: |
          if [ -z "$SHELL_ID_SERVER" ]; then
            echo "::error::Repository secret SHELL_ID_SERVER is not set."
            exit 1
          fi
          if [ -z "$SHELL_KEY" ]; then
            echo "::warning::Repository secret SHELL_KEY is not set; connections will not be encrypted with your server key."
          fi

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-shell

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; cat "$_1"; echo ""
            done
            exit 1
          fi

      - name: Build
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Find Runner.res
        # Runner.res (compiled from flutter/windows/runner/Runner.rc) carries the version info.
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then
            cp $runner_res ./libs/portable/Runner.res
          fi

      - name: Build single-file executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          name="${SHELL_APP_NAME:-KRDesk}"
          mkdir -p ./output
          mv ./target/release/rustdesk-portable-packer.exe "./output/${name}-${VERSION}-x86_64.exe"
          ls -l ./output

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-windows-x86_64
          path: ./output
          if-no-files-found: error
          retention-days: 30
