name: Flutter Nightly Build

on:
  # The daily full-platform cron is off on this fork. It called the same
  # multi-platform workflow as Full Flutter CI. Run it by hand if needed.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
