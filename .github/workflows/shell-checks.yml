# Lightweight checks for this fork. Does not compile the client, call the
# multi-platform Flutter workflow, or publish an executable.
name: Shell checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Shell policy tests
        run: sh .github/scripts/shell-policy-check.sh

      - name: Install Dart
        uses: dart-lang/setup-dart@e630b99d28a3b71860378cafdc2a067c71107f94 # v1.7.0
        with:
          sdk: 3.5.4

      - name: Login gate checks
        run: dart flutter/tool/check_shell_gate.dart
